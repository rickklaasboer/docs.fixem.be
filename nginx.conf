server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects so the trailing-slash 301 keeps the client's scheme,
    # host and port — correct when a reverse proxy terminates TLS in front.
    absolute_redirect off;

    # Liveness endpoint for the container healthcheck and the shared gatus probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Astro fingerprints these filenames, so they can be cached indefinitely.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Astro emits directory-style routes (foo/index.html). try_files serves those
    # and lets nginx redirect extension-less paths to their trailing-slash form.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/xml+rss;
}
